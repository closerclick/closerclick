<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Limpia cualquier cache de versiones anteriores del SW
      if ('caches' in window) {
        caches.keys().then(keys => keys.forEach(k => caches.delete(k)))
      }
    </script>
    <title>Closer Click - Ecosistema de Aplicaciones</title>
    <!-- Analítica cookieless autohosteada (GoatCounter); no cuenta en localhost/LAN. -->
    <script>window.goatcounter={path:function(p){return location.hostname+p}}</script>
    <script data-goatcounter="https://goat.closer.click/count" async src="https://goat.closer.click/count.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
